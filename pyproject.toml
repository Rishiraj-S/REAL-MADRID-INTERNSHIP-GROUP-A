[project]
name = "real-madrid-acwr"
version = "0.1.0"
description = "Streamlit ACWR forecasting tool for football training load planning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.18",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "streamlit>=1.40",
    "xgboost>=2.0",
]

[project.scripts]
train-real-madrid-acwr-models = "real_madrid_acwr.modeling.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-Pillow",
]
notebooks = [
    "ipywidgets>=8.1",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "shap>=0.44",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "notebooks",
    "utils/data_pipeline.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.11"
files = ["src/app", "src/real_madrid_acwr", "tests"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
